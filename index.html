<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Totally</title>
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1234567890123456" data-adbreak-test="on" crossorigin="anonymous"></script>
    <script>
      window.adsbygoogle = window.adsbygoogle || [];
      window.adBreak = window.adConfig = function(o) { window.adsbygoogle.push(o); }
      window.adConfig({
        preloadAdBreaks: 'on',
        onReady: () => { 
          console.log("H5 Games Ads ready"); 
          window.h5AdsReady = true;
        }
      });
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-width: 1px;
        min-height: 1px;
        background-color: #000;
        overflow: hidden;
        position: fixed;
      }
      #game-container {
        width: 100%;
        height: 100%;
        min-width: 1px;
        min-height: 1px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script src="./phaser.min.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
